name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-xcode
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build
        run: |
          xcodebuild -project ElementX.xcodeproj \
            -scheme ElementX \
            -configuration Debug \
            CODE_SIGNING_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build
